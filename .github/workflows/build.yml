name: build

on:
  push:
    branches: [main, hadron]
    paths:
      - containerfile
      - justfile
      - .github/workflows/build.yml
  pull_request:
    paths:
      - containerfile
      - justfile
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      push:
        description: push images to GHCR
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64, rpi4, rpi3]
    env:
      REGISTRY_PATH: ghcr.io/nothingneko/jadeite
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: install podman + just
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          curl -fsSL https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

      - name: register qemu for cross-arch builds
        if: matrix.variant != 'amd64'
        run: |
          sudo podman run --rm --privileged docker.io/multiarch/qemu-user-static --reset -p yes

      - name: decide whether to push
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: log in to GHCR
        if: steps.gate.outputs.push == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build ${{ matrix.variant }}
        run: just build-${{ matrix.variant }}

      - name: push ${{ matrix.variant }}
        if: steps.gate.outputs.push == 'true'
        run: |
          just push-${{ matrix.variant }}
          # also tag/push :latest for the amd64 flagship image
          if [ "${{ matrix.variant }}" = "amd64" ]; then
            podman tag  "$REGISTRY_PATH:$VERSION-amd64" "$REGISTRY_PATH:latest"
            podman push "$REGISTRY_PATH:latest"
          fi
